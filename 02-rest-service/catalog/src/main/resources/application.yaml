spring:
  application:
    name: catalog
  lifecycle:
    # must stay below terminationGracePeriodSeconds (30s by default in K8s)
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  docker:
    compose:
      enabled: false

server:
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
