# Configuration from environment variables only: PORT, SPRING_DATASOURCE_URL|USERNAME|PASSWORD,
# KAFKA_BOOTSTRAP_SERVERS, APICURIO_URL, FORGE_GRPC_TARGET, QUOTE_DEADLINE.
spring:
  application:
    name: ordering
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  grpc:
    client:
      channel:
        forge:
          # Forge's QuoteService (plaintext inside the compose network)
          target: ${FORGE_GRPC_TARGET:static://localhost:9090}
  flyway:
    placeholders:
      # The connector's database user (V2__outbox.sql grants it the outbox)
      cdcUser: ${CDC_USER:cdc}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      # Apicurio Registry 3 SerDe; the pipeline registers the schemas (scripts/register-schemas.sh), never the service
      apicurio.registry.url: ${apicurio.url}/apis/registry/v3
      apicurio.registry.auto-register: false
      apicurio.registry.use-specific-avro-reader: true
      # The schema id travels in the value, not in Kafka headers: the outbox holds only the value (15)
      apicurio.registry.headers.enabled: false
    consumer:
      group-id: ordering
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Unreadable bytes become a DeserializationException the error handler parks on the DLT
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.apicurio.registry.serde.avro.AvroKafkaDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.apicurio.registry.serde.avro.AvroKafkaSerializer
      properties:
        # Write with the schema version this build's contract is (contracts.version, filtered in by Maven): no
        # lookup by content (the generated classes carry avro.java.string, the registered .avsc does not)
        apicurio.registry.artifact.version: "@contracts.version@"
        # Kafka's defaults; drill 1 (modulith) shortens them so an outage really fails the relay's sends
        max.block.ms: ${KAFKA_PRODUCER_MAX_BLOCK_MS:60000}
        request.timeout.ms: ${KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:30000}
        delivery.timeout.ms: ${KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:120000}
    listener:
      ack-mode: record
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      # Publications not completed before a crash are handed to their listeners again on start
      republish-outstanding-events-on-restart: true
outbox:
  # debezium: the order transaction writes ordering.outbox, Debezium publishes it; modulith: RequestRelay (14)
  mode: ${OUTBOX_MODE:debezium}
  retention: ${OUTBOX_RETENTION:1h}
  cleanup-interval: ${OUTBOX_CLEANUP_INTERVAL:5m}
apicurio:
  url: ${APICURIO_URL:http://localhost:8085}
forge:
  # A slow or absent Forge must not hold the customer: no quote within this time = REJECTED "quote unavailable"
  quote-deadline: ${QUOTE_DEADLINE:2s}
kafka:
  retry:
    # Failed records: back off this long, then <topic>.DLT (KafkaErrorHandling)
    max-elapsed: ${KAFKA_RETRY_MAX_ELAPSED:5m}
server:
  port: ${PORT:8080}
  shutdown: graceful
management:
  endpoint:
    health:
      probes:
        enabled: true
