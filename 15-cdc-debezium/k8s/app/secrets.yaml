# The Debezium user's password. A learning cluster: a plain dev password in git (21 replaces this with External
# Secrets + OpenBao). CNPG sets it on the managed role, the connector reads it through the secrets config provider.
apiVersion: v1
kind: Secret
metadata:
  name: cdc-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: kubernetes.io/basic-auth
stringData:
  username: cdc
  password: cdc-dev-password
