# The namespaced part of 15 (hephaestus-15): databases, registry, Kafka Connect, services, route. The KafkaTopics
# live in namespace kafka (topics.yaml), applied apart.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - secrets.yaml
  - databases.yaml
  - registry.yaml
  - connect.yaml
  - services.yaml
  - route.yaml

# Copies of contracts/src/main/avro and scripts/register-schemas.sh (kustomize reads nothing outside this folder);
# CI checks they are identical to the sources.
configMapGenerator:
  - name: avro-schemas
    files:
      - schema-init/work_order_request.avsc
      - schema-init/forge_event.avsc
  - name: schema-init-script
    files:
      - schema-init/register-schemas.sh

# Published by CI on main (sha-<7>); set to the merge commit's sha when the platform app is enabled
images:
  - name: ordering
    newName: ghcr.io/cucumber405d/hephaestus/cdc-debezium-ordering
    newTag: latest
  - name: forge-service
    newName: ghcr.io/cucumber405d/hephaestus/cdc-debezium-forge-service
    newTag: latest
  - name: supplier-stub
    newName: ghcr.io/cucumber405d/hephaestus/cdc-debezium-supplier-stub
    newTag: latest

# KafkaConnect.spec.image is not a container field: the images transformer does not touch it
patches:
  - target:
      kind: KafkaConnect
      name: cdc-connect
    patch: |-
      - op: replace
        path: /spec/image
        value: ghcr.io/cucumber405d/hephaestus/cdc-debezium-connect:latest
