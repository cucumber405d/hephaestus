# http://cdc.localtest.me — the smith's API to forge-service, everything else (orders) to Ordering.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cdc
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames:
    - cdc.localtest.me
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/work-orders
      backendRefs:
        - name: forge-service
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ordering
          port: 80
