# The 08 stack from the Jib images (build: ../mvnw -f pom.xml package jib:dockerBuild -DskipTests):
#   inventory -> toxiproxy:8666 -> supplier, plus Redis (offer cache) and PostgreSQL (stock).
#   docker compose up -d   then   curl localhost:8080/api/supply/r4j/ANVIL-01
# Break things by hand: Toxiproxy API on localhost:8474, supplier faults on localhost:8090/admin/faults.
services:
  inventory-db:
    image: postgres:17
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  supplier:
    image: hephaestus/resilience-supplier:${IMAGE_TAG:-jib}
    environment:
      PORT: "8080"
    mem_limit: 512m
    ports:
      - "8090:8080"

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "8474:8474"

  inventory:
    image: hephaestus/resilience-inventory:${IMAGE_TAG:-jib}
    environment:
      PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: inventory
      REDIS_URL: redis://redis:6379
      # Through the fault injector, never directly
      SUPPLIER_URL: http://toxiproxy:8666
    mem_limit: 768m
    ports:
      - "8080:8080"
    depends_on:
      inventory-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      toxiproxy:
        condition: service_started
      supplier:
        condition: service_started
