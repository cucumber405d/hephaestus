# The supplier: PORT only. Virtual threads, so injected delays do not exhaust a thread pool.
spring:
  application:
    name: supplier
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # A Faults body with a typo must not silently become "no faults"
      fail-on-unknown-properties: true

server:
  port: ${PORT:8090}
  shutdown: graceful

management:
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
