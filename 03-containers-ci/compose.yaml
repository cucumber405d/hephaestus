# Local stack for 03-containers-ci.
#   docker compose up -d                 -> PostgreSQL only (also what "spring-boot:run" with profile local starts)
#   docker compose --profile app up -d   -> PostgreSQL + the catalog image (CATALOG_IMAGE, default the Jib image)
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
    ports:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog"]
      interval: 2s
      timeout: 2s
      retries: 30

  catalog:
    profiles: [app]
    image: ${CATALOG_IMAGE:-hephaestus/catalog:jib}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/catalog
      SPRING_DATASOURCE_USERNAME: catalog
      SPRING_DATASOURCE_PASSWORD: catalog
    ports:
      - "8080:8080"
    # The same limits as the container-limit tests; 768m fits the Paketo memory calculator defaults
    mem_limit: 768m
    cpus: 1
    depends_on:
      postgres:
        condition: service_healthy
