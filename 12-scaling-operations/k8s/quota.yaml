# kind nodes report the whole host's memory, so the scheduler would place every scaled-out pod and the kernel would
# OOM-kill something (possibly the Kafka broker). The quota caps the namespace instead: a pod over it is not created,
# the HPA shows FailedCreate, the saga waits in Kafka — a visible ceiling instead of random kills.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: memory
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  hard:
    requests.memory: 10Gi
    limits.memory: 14Gi
