# The peak sale enters here: http://orders.localtest.me -> Ordering
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orders
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames:
    - orders.localtest.me
  rules:
    - backendRefs:
        - name: ordering
          port: 80
