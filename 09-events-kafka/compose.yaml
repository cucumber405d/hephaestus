# The 09 playground from the Jib images (build: ../mvnw -f pom.xml package jib:dockerBuild -DskipTests):
#   ordering -> Kafka (orders.events, 3 partitions) -> notification (consumer group) / notification-share (share group)
#   docker compose up -d                                  Kafka UI: http://localhost:8085
#   docker compose up -d --scale notification=3           three consumers, one partition each
#   docker compose --profile share up -d --scale notification-share=5
services:
  kafka:
    image: apache/kafka:4.2.2
    environment:
      # A KRaft cluster id (base64 UUID); any fixed value works for a local single node
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL for the containers, EXTERNAL (localhost:9094) for tools on the host
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Single broker: every internal topic with one replica
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # Rebalance at once when members join (the default waits 3 s to collect them)
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-ui:
    # Topics, partitions, consumer groups with their lag, messages with headers
    image: ghcr.io/kafbat/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: hephaestus-09
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8085:8080"
    depends_on:
      kafka:
        condition: service_healthy

  ordering-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ordering
      POSTGRES_USER: ordering
      POSTGRES_PASSWORD: ordering
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordering -d ordering"]
      interval: 2s
      timeout: 2s
      retries: 30

  notification-db:
    image: postgres:17
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Own database for the share variant: its processed-event table must not see the classic group's events
  notification-share-db:
    image: postgres:17
    profiles: ["share"]
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: notification
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]
      interval: 2s
      timeout: 2s
      retries: 30

  ordering:
    image: hephaestus/events-kafka-ordering:${IMAGE_TAG:-jib}
    environment:
      PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://ordering-db:5432/ordering
      SPRING_DATASOURCE_USERNAME: ordering
      SPRING_DATASOURCE_PASSWORD: ordering
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    mem_limit: 768m
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      ordering-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification:
    image: hephaestus/events-kafka-notification:${IMAGE_TAG:-jib}
    environment:
      PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notification
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATION_MODE: classic
    mem_limit: 512m
    # A range, so --scale gives every instance its own host port; bound to localhost only: the /admin endpoints
    # (faults, replay) are open, fine for a local playground but not for the network
    ports:
      - "127.0.0.1:8091-8095:8080"
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  notification-share:
    image: hephaestus/events-kafka-notification:${IMAGE_TAG:-jib}
    profiles: ["share"]
    environment:
      PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-share-db:5432/notification
      SPRING_DATASOURCE_USERNAME: notification
      SPRING_DATASOURCE_PASSWORD: notification
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NOTIFICATION_MODE: share
    mem_limit: 512m
    ports:
      - "127.0.0.1:8096-8100:8080"
    depends_on:
      notification-share-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
