# 06 on the shared platform (Argo CD Application "security" in platform/apps).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - inventory.yaml
  - ordering.yaml
  - gateway.yaml

# Images published by CI on main: sha-<7> of the merge commit that built them (PR #6 -> 7a5b35e).
# A new version is rolled out by changing these tags (in 20: by Argo CD Image Updater / Rollouts).
images:
  - name: inventory
    newName: ghcr.io/cucumber405d/hephaestus/security-inventory
    newTag: sha-7a5b35e
  - name: ordering
    newName: ghcr.io/cucumber405d/hephaestus/security-ordering
    newTag: sha-7a5b35e
  - name: gateway
    newName: ghcr.io/cucumber405d/hephaestus/security-gateway
    newTag: sha-7a5b35e
