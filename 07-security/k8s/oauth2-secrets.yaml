# Client secrets of the realm clients "ordering" and "shop-gateway" (see keycloak-realm.yaml).
# Committed on purpose: throw-away values for the local learning cluster. In a real cluster they come from a secret
# store (External Secrets, Sealed Secrets, Vault) and Keycloak gets them through realm import placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: oauth2-clients
  annotations:
    argocd.argoproj.io/sync-wave: "0"
type: Opaque
stringData:
  ordering-client-secret: ordering-secret-local-only
  shop-gateway-client-secret: shop-gateway-secret-local-only
