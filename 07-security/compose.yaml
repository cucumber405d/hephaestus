# The whole 07 stack from the Jib images (build: ../mvnw -f pom.xml package jib:dockerBuild -DskipTests) plus Keycloak.
#   docker compose up -d   -> log in at http://localhost:8080/oauth2/authorization/keycloak (alice/alice, bob/bob, admin/admin)
# Keycloak's public address is http://localhost:8180 (that is the "iss" of every token); the services reach it inside
# Compose as http://keycloak:8080 for keys and tokens (backchannel). Secrets here are for local use only.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/hephaestus-realm.json:/opt/keycloak/data/import/hephaestus-realm.json:ro
    healthcheck:
      # The image has no curl: plain HTTP over bash's /dev/tcp to the management port
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 5s
      retries: 60

  inventory-db:
    image: postgres:17
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_PASSWORD: inventory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 2s
      timeout: 2s
      retries: 30

  ordering-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ordering
      POSTGRES_USER: ordering
      POSTGRES_PASSWORD: ordering
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ordering -d ordering"]
      interval: 2s
      timeout: 2s
      retries: 30

  inventory:
    image: hephaestus/security-inventory:${IMAGE_TAG:-jib}
    environment:
      PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory
      SPRING_DATASOURCE_USERNAME: inventory
      SPRING_DATASOURCE_PASSWORD: inventory
      OAUTH2_ISSUER: http://localhost:8180/realms/hephaestus
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/hephaestus/protocol/openid-connect/certs
    mem_limit: 768m
    depends_on:
      inventory-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  ordering:
    image: hephaestus/security-ordering:${IMAGE_TAG:-jib}
    environment:
      PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://ordering-db:5432/ordering
      SPRING_DATASOURCE_USERNAME: ordering
      SPRING_DATASOURCE_PASSWORD: ordering
      INVENTORY_URL: http://inventory:8080
      OAUTH2_ISSUER: http://localhost:8180/realms/hephaestus
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/hephaestus/protocol/openid-connect/certs
      OAUTH2_TOKEN_URI: http://keycloak:8080/realms/hephaestus/protocol/openid-connect/token
      ORDERING_CLIENT_SECRET: ordering-secret-local-only
    mem_limit: 768m
    depends_on:
      ordering-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  gateway:
    image: hephaestus/security-gateway:${IMAGE_TAG:-jib}
    environment:
      PORT: "8080"
      ORDERING_URL: http://ordering:8080
      INVENTORY_URL: http://inventory:8080
      # The browser is sent to the public address; the gateway itself talks to Keycloak inside Compose
      OAUTH2_AUTHORIZATION_URI: http://localhost:8180/realms/hephaestus/protocol/openid-connect/auth
      OAUTH2_TOKEN_URI: http://keycloak:8080/realms/hephaestus/protocol/openid-connect/token
      OAUTH2_JWK_SET_URI: http://keycloak:8080/realms/hephaestus/protocol/openid-connect/certs
      OAUTH2_USER_INFO_URI: http://keycloak:8080/realms/hephaestus/protocol/openid-connect/userinfo
      SHOP_GATEWAY_CLIENT_SECRET: shop-gateway-secret-local-only
    mem_limit: 512m
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      keycloak:
        condition: service_healthy
