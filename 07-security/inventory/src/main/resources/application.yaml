# Configuration from environment variables only: PORT, SPRING_DATASOURCE_URL|USERNAME|PASSWORD,
# OAUTH2_ISSUER (public "iss" of the tokens), OAUTH2_JWK_SET_URI (internal address of the signing keys).
spring:
  application:
    name: inventory
  main:
    banner-mode: off
  lifecycle:
    timeout-per-shutdown-phase: 20s
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  security:
    oauth2:
      resourceserver:
        jwt:
          # With jwk-set-uri set, issuer-uri is only compared with "iss": no discovery call to the public address
          issuer-uri: ${OAUTH2_ISSUER}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI}
          # Tokens must be meant for us (Keycloak audience mapper adds "inventory")
          audiences: inventory
  mvc:
    problemdetails:
      enabled: true
    apiversion:
      # API-Version request header; 1 (deprecated) is the default when the header is absent, 2 is current
      use:
        header: API-Version
      supported: 1,2
      default: 1

server:
  port: ${PORT:8081}
  shutdown: graceful
  # Behind the Gateway: build Location headers from X-Forwarded-* so clients get the public host, not ours
  forward-headers-strategy: framework

management:
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs
