# Test defaults for the variables application.yaml requires (classpath:/config/ is read in addition to it).
# Nothing is fetched from these addresses: tests authenticate with spring-security-test's jwt().
OAUTH2_ISSUER=http://issuer.test/realms/hephaestus
OAUTH2_JWK_SET_URI=http://issuer.test/realms/hephaestus/protocol/openid-connect/certs
