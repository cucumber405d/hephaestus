# Test defaults for the variables application.yaml requires (classpath:/config/ is read in addition to it).
# Nothing is fetched from these addresses: tests authenticate with spring-security-test's jwt(); OrderingIT points
# the token URI at its stub server.
OAUTH2_ISSUER=http://issuer.test/realms/hephaestus
OAUTH2_JWK_SET_URI=http://issuer.test/realms/hephaestus/protocol/openid-connect/certs
OAUTH2_TOKEN_URI=http://issuer.test/realms/hephaestus/protocol/openid-connect/token
ORDERING_CLIENT_SECRET=test-secret
