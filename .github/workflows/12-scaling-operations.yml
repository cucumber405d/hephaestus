# 12-scaling-operations: verify (load module tests, manifests render, script self-tests) -> e2e in kind with the
# platform profile "scaling": the peak sale with autoscaling only and with a rolling restart, at a CI-sized rate.
name: 12-scaling-operations

on:
  push:
    branches: [main]
    paths:
      - "12-scaling-operations/**"
      - "platform/**"
      - "mvnw"
      - ".mvn/**"
      - ".github/workflows/12-scaling-operations.yml"
  pull_request:
    paths:
      - "12-scaling-operations/**"
      - "platform/**"
      - "mvnw"
      - ".mvn/**"
      - ".github/workflows/12-scaling-operations.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Load module tests
        run: ./mvnw -B -ntp -f 12-scaling-operations/load/pom.xml test

      - name: Manifests render
        run: |
          kubectl kustomize 12-scaling-operations/k8s > /tmp/12.yaml
          for kind in ResourceQuota:1 KafkaTopic:8 Cluster:4 Deployment:4 ScaledObject:4 PodDisruptionBudget:4 CronJob:4 HTTPRoute:1; do
            n=$(grep -c "^kind: ${kind%%:*}$" /tmp/12.yaml || true)
            echo "${kind%%:*}: $n"
            [ "$n" -eq "${kind##*:}" ]
          done

      - name: Script self-tests
        run: |
          bash 12-scaling-operations/scripts/test/reconcile-fixture.sh
          bash 12-scaling-operations/scripts/test/drain-node-fixture.sh

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Three kind nodes exceed the runner's default inotify limits ("too many open files")
      - name: Raise inotify limits
        run: sudo sysctl fs.inotify.max_user_instances=1024 fs.inotify.max_user_watches=524288

      # *.localtest.me without public DNS
      - name: Hosts
        run: echo "127.0.0.1 orders.localtest.me grafana.localtest.me argocd.localtest.me" | sudo tee -a /etc/hosts

      - uses: helm/kind-action@v1
        with:
          config: platform/kind/cluster.yaml
          cluster_name: hephaestus

      - name: Bootstrap platform (profile scaling)
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: platform/bootstrap.sh scaling "$REVISION"

      - name: Wait for the Applications
        run: |
          deadline=$(( $(date +%s) + 1500 ))
          while true; do
            states=$(kubectl -n argocd get applications -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.sync.status}{" "}{.status.health.status}{"\n"}{end}' || true)
            echo "$states"
            [ -n "$states" ] && ! echo "$states" | grep -v ' Synced Healthy$' >/dev/null && break
            [ "$(date +%s)" -ge "$deadline" ] && exit 1
            sleep 20
          done

      - name: Peak sale, autoscaling only
        env:
          PEAK_RATE: "8"
          PEAK_SECONDS: "90"
        run: 12-scaling-operations/scripts/peak.sh scale

      - name: Peak sale with a rolling restart
        env:
          PEAK_RATE: "8"
          PEAK_SECONDS: "90"
        run: 12-scaling-operations/scripts/peak.sh rollout

      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n argocd get applications -o wide || true
          kubectl get pods -A -o wide || true
          kubectl -n hephaestus-12 get scaledobject,hpa,pdb || true
          kubectl get events -A --sort-by=.metadata.creationTimestamp | tail -80 || true
          for s in ordering payment inventory delivery; do kubectl -n hephaestus-12 logs deploy/$s --tail=60 || true; done
