# 09-events-kafka: verify -> end-to-end test of the stack in Compose -> publish the two images (main only).
name: 09-events-kafka

on:
  push:
    branches: [main]
    paths:
      - "09-events-kafka/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".gitattributes"
      - ".github/workflows/build-subproject.yml"
      - ".github/workflows/publish-image.yml"
      - ".github/workflows/09-events-kafka.yml"
  pull_request:
    paths:
      - "09-events-kafka/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".gitattributes"
      - ".github/workflows/build-subproject.yml"
      - ".github/workflows/publish-image.yml"
      - ".github/workflows/09-events-kafka.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # cancel stale runs only for PRs; every commit on main gets built
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/build-subproject.yml
    with:
      subproject: 09-events-kafka

  # Ordering, Notification and Kafka in Docker Compose: the event scenarios
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: End-to-end test
        run: 09-events-kafka/scripts/e2e.sh

  publish:
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        module: [ordering, notification]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      subproject: 09-events-kafka
      module: ${{ matrix.module }}
      image-name: hephaestus/events-kafka-${{ matrix.module }}
