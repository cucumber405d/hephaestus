# 10-outbox-saga: verify -> end-to-end test of the stack in Compose -> publish the four images (main only).
name: 10-outbox-saga

on:
  push:
    branches: [main]
    paths:
      - "10-outbox-saga/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".gitattributes"
      - ".github/workflows/build-subproject.yml"
      - ".github/workflows/publish-image.yml"
      - ".github/workflows/10-outbox-saga.yml"
  pull_request:
    paths:
      - "10-outbox-saga/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".gitattributes"
      - ".github/workflows/build-subproject.yml"
      - ".github/workflows/publish-image.yml"
      - ".github/workflows/10-outbox-saga.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # cancel stale runs only for PRs; every commit on main gets built
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/build-subproject.yml
    with:
      subproject: 10-outbox-saga

  # the four services, Kafka and PostgreSQL in Docker Compose: the saga scenarios in both styles
  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: End-to-end test
        run: 10-outbox-saga/scripts/e2e.sh

  publish:
    needs: e2e
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        module: [ordering, payment, inventory, delivery]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      subproject: 10-outbox-saga
      module: ${{ matrix.module }}
      image-name: hephaestus/outbox-saga-${{ matrix.module }}
