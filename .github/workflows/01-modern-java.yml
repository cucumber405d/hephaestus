# Builds 01-modern-java on JDK 27.
name: 01-modern-java

on:
  push:
    branches: [main]
    paths:
      - "01-modern-java/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".gitattributes"
      - ".github/workflows/build-subproject.yml"
      - ".github/workflows/01-modern-java.yml"
  pull_request:
    paths:
      - "01-modern-java/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".gitattributes"
      - ".github/workflows/build-subproject.yml"
      - ".github/workflows/01-modern-java.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # cancel stale runs only for PRs; every commit on main gets built
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-subproject.yml
    with:
      subproject: 01-modern-java
      java-version: "27"

  # palantir-java-format cannot run on JDK 27, so formatting of the features module is checked on JDK 25.
  # Invoking the goal directly skips the lifecycle, so the [27,) enforcer rule does not fire.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Spotless check (features)
        run: ./mvnw -B -ntp -f 01-modern-java/features/pom.xml spotless:check -Dspotless.check.skip=false
