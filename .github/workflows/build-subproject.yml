# Reusable: builds and tests one subproject. Called from NN-<name>.yml.
name: build-subproject

on:
  workflow_call:
    inputs:
      subproject:
        description: "Subproject directory, e.g. _template or 02-rest-service"
        required: true
        type: string
      java-version:
        description: "JDK version to build with"
        required: false
        type: string
        default: "25"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Verify
        env:
          SUBPROJECT: ${{ inputs.subproject }}
        run: ./mvnw -B -ntp -f "$SUBPROJECT/pom.xml" verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: reports-${{ inputs.subproject }}
          path: |
            ${{ inputs.subproject }}/**/target/surefire-reports/
            ${{ inputs.subproject }}/**/target/failsafe-reports/
            ${{ inputs.subproject }}/**/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 14
