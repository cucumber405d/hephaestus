# Builds 06-service-communication (verify); e2e and image publishing jobs are added in a later step.
name: 06-service-communication

on:
  push:
    branches: [main]
    paths:
      - "06-service-communication/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".gitattributes"
      - ".github/workflows/build-subproject.yml"
      - ".github/workflows/06-service-communication.yml"
  pull_request:
    paths:
      - "06-service-communication/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".gitattributes"
      - ".github/workflows/build-subproject.yml"
      - ".github/workflows/06-service-communication.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # cancel stale runs only for PRs; every commit on main gets built
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build-subproject.yml
    with:
      subproject: 06-service-communication
