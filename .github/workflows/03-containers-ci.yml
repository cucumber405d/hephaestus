# 03-containers-ci: verify -> build and test the image four ways -> publish the Jib image to GHCR (main only).
name: 03-containers-ci

on:
  push:
    branches: [main]
    paths:
      - "03-containers-ci/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".gitattributes"
      - ".github/workflows/build-subproject.yml"
      - ".github/workflows/publish-image.yml"
      - ".github/workflows/03-containers-ci.yml"
  pull_request:
    paths:
      - "03-containers-ci/**"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "mvnw.cmd"
      - ".gitattributes"
      - ".github/workflows/build-subproject.yml"
      - ".github/workflows/publish-image.yml"
      - ".github/workflows/03-containers-ci.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # cancel stale runs only for PRs; every commit on main gets built
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/build-subproject.yml
    with:
      subproject: 03-containers-ci

  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavor: [buildpacks, jib, dockerfile, dockerfile-jlink]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build image
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: 03-containers-ci/scripts/build-images.sh "$FLAVOR"

      # Only the *ImageIT classes run: unit and application tests already passed in verify
      - name: Image tests
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: >-
          ./mvnw -B -ntp -f 03-containers-ci/pom.xml -Pimage-it
          -Djib.skip=true -Dtest=none -Dsurefire.failIfNoSpecifiedTests=false
          -Dcatalog.image="hephaestus/catalog:$FLAVOR" -Dcatalog.flavor="$FLAVOR"
          verify

      - name: Image summary
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          image="hephaestus/catalog:$FLAVOR"
          size=$(docker image inspect -f '{{.Size}}' "$image" | awk '{ printf "%.0f", $1 / 1000000 }')
          layers=$(docker image inspect -f '{{len .RootFS.Layers}}' "$image")
          echo "| $FLAVOR | $size MB | $layers layers |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload image test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: image-reports-${{ matrix.flavor }}
          path: 03-containers-ci/**/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 14

  # Only an image whose tests passed for every build method reaches the registry
  publish:
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-image.yml
    with:
      subproject: 03-containers-ci
      module: catalog
      image-name: hephaestus/containers-ci-catalog
