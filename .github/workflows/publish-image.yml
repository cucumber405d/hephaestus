# Reusable: builds one module's Jib image and pushes it to GHCR as sha-<7 chars> and latest.
# Call it after the image tests, on main only; the caller grants packages: write.
name: publish-image

on:
  workflow_call:
    inputs:
      subproject:
        description: "Subproject directory, e.g. 03-containers-ci"
        required: true
        type: string
      module:
        description: "Maven module with the jib-maven-plugin configuration, e.g. catalog"
        required: true
        type: string
      image-name:
        description: "Image name below ghcr.io/<owner>/, e.g. hephaestus/containers-ci-catalog"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      # Jib reads the credentials docker login writes to ~/.docker/config.json
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push with Jib
        env:
          SUBPROJECT: ${{ inputs.subproject }}
          MODULE: ${{ inputs.module }}
          IMAGE_NAME: ${{ inputs.image-name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/$IMAGE_NAME"
          tag="sha-${GITHUB_SHA::7}"
          ./mvnw -B -ntp -f "$SUBPROJECT/pom.xml" -pl "$MODULE" package jib:build -DskipTests \
            -Djib.to.image="$image:$tag" -Djib.to.tags=latest -Dimage.revision="$GITHUB_SHA"
          digest=$(cat "$SUBPROJECT/$MODULE/target/jib-image.digest")
          {
            echo "### Published"
            echo
            echo "- \`$image:$tag\` (also \`latest\`)"
            echo "- digest: \`$digest\`"
            echo "- pull by digest: \`docker pull $image@$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"
