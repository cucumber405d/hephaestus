# Configuration from environment variables only: PORT, GRPC_PORT, SPRING_DATASOURCE_URL|USERNAME|PASSWORD,
# SUPPLIER_URL, SUPPLIER_TIMEOUT, FORGE_SUPPLY_RETRY, KAFKA_BOOTSTRAP_SERVERS, APICURIO_URL, FORGE_QUOTE_TTL.
spring:
  application:
    name: forge-service
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
  flyway:
    # The database user "forge" meets schema "forge" (V3): without this, Flyway's history would move from public to
    # forge ("$user" in search_path) after V3 and a restart would find none (the lesson of 15)
    default-schema: public
  grpc:
    server:
      # QuoteService (Netty, plaintext inside the cluster/compose network)
      port: ${GRPC_PORT:9090}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      # Apicurio Registry 3 SerDe; the pipeline registers the schemas (scripts/register-schemas.sh), never the service
      apicurio.registry.url: ${apicurio.url}/apis/registry/v3
      apicurio.registry.auto-register: false
      apicurio.registry.use-specific-avro-reader: true
      # The schema id travels in the value, not in Kafka headers (as Ordering's outbox bytes do)
      apicurio.registry.headers.enabled: false
    consumer:
      group-id: forge-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # Unreadable bytes become a DeserializationException the error handler parks on the DLT
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.apicurio.registry.serde.avro.AvroKafkaDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.apicurio.registry.serde.avro.AvroKafkaSerializer
      properties:
        # Write with the schema version this build's contract is (contracts.version, filtered in by Maven): no
        # lookup by content (the generated classes carry avro.java.string, the registered .avsc does not)
        apicurio.registry.artifact.version: "@contracts.version@"
    listener:
      ack-mode: record
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true
      republish-outstanding-events-on-restart: true
apicurio:
  url: ${APICURIO_URL:http://localhost:8085}
supplier:
  url: ${SUPPLIER_URL:http://localhost:8081}
  timeout: ${SUPPLIER_TIMEOUT:2s}
forge:
  supply-retry: ${FORGE_SUPPLY_RETRY:10s}
  # A quote binds Forge this long; Ordering sends quoteId and price with the request
  quote-ttl: ${FORGE_QUOTE_TTL:15m}
  units-per-day: 5
  # Cents per unit and base days; brackets keep the keys as written
  price-list:
    "[IRON-01]":
      cents-per-unit: 1200
      base-days: 2
    "[STEEL-01]":
      cents-per-unit: 2500
      base-days: 3
    "[MITHRIL-01]":
      cents-per-unit: 99000
      base-days: 30
kafka:
  retry:
    # Failed records: back off this long, then <topic>.DLT (KafkaErrorHandling)
    max-elapsed: ${KAFKA_RETRY_MAX_ELAPSED:5m}
server:
  port: ${PORT:8080}
  shutdown: graceful
management:
  endpoint:
    health:
      probes:
        enabled: true
