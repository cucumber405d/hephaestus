# Two databases, two owners: Ordering's and Forge's (the event store and its read models).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ordering-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: ordering
      owner: ordering
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forge-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: forge
      owner: forge
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
