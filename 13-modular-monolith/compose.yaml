# 13 in Docker Compose: the modular monolith, forge-service, the supplier stub, Kafka and two PostgreSQL — the
# cutover end to end without a cluster (scripts/e2e.sh; CI). Images from ../mvnw ... jib:dockerBuild (tag jib).
#   docker compose -f 13-modular-monolith/compose.yaml -p hephaestus-13 up -d --wait
# Ports: monolith 18080, forge-service 18081, supplier 18082, Kafka (host) 19094.
services:
  kafka:
    image: apache/kafka:4.2.2
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:19094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:19094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # The monolith's database (schemas ordering, inventory, forge, migration)
  postgres-monolith:
    image: postgres:17
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: workshop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U workshop -d workshop"]
      interval: 2s
      timeout: 5s
      retries: 30

  # forge-service's own database: nothing shared with the monolith (ADR-0009)
  postgres-forge:
    image: postgres:17
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: forge
      POSTGRES_DB: forge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U forge -d forge"]
      interval: 2s
      timeout: 5s
      retries: 30

  supplier-stub:
    image: hephaestus/modular-monolith-supplier-stub:${IMAGE_TAG:-jib}
    mem_limit: 384m
    ports:
      - "127.0.0.1:18082:8080"
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]

  modular:
    image: hephaestus/modular-monolith-modular:${IMAGE_TAG:-jib}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-monolith:5432/workshop
      SPRING_DATASOURCE_USERNAME: workshop
      SPRING_DATASOURCE_PASSWORD: workshop
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SUPPLIER_URL: http://supplier-stub:8080
    mem_limit: 640m
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      postgres-monolith:
        condition: service_healthy
      kafka:
        condition: service_healthy

  forge-service:
    image: hephaestus/modular-monolith-forge-service:${IMAGE_TAG:-jib}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-forge:5432/forge
      SPRING_DATASOURCE_USERNAME: forge
      SPRING_DATASOURCE_PASSWORD: forge
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SUPPLIER_URL: http://supplier-stub:8080
      # the facade list wraps the monolith's open work orders during the transition
      MONOLITH_URL: http://modular:8080
    mem_limit: 640m
    ports:
      - "127.0.0.1:18081:8080"
    depends_on:
      postgres-forge:
        condition: service_healthy
      kafka:
        condition: service_healthy
