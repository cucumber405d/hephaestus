# Configuration from environment variables only: PORT, SPRING_DATASOURCE_URL|USERNAME|PASSWORD, SUPPLIER_URL.
spring:
  application:
    name: legacy
  main:
    banner-mode: off
  threads:
    virtual:
      enabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
management:
  endpoint:
    health:
      probes:
        enabled: true
