  selector:
    matchLabels:
      app.kubernetes.io/name: forge-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-service
    spec:
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
