# http://workshop.localtest.me — the Strangler Fig facade at the edge (ADR-0009). Static from day one: the cutover is
# a flag in the monolith, the routes never change while it happens.
#   1. the monolith's own work orders (WO-…) -> the monolith (they finish there, variant A)
#   2. everything else of the smith's API (FW-…, the list) -> forge-service (the list wraps the monolith's open orders)
#   3. the rest (orders, admin) -> the monolith
# Path regex is supported by Envoy Gateway; header regex is not.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: workshop
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames:
    - workshop.localtest.me
  rules:
    - matches:
        - path:
            type: RegularExpression
            value: ^/api/work-orders/WO-.*
      backendRefs:
        - name: modular
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /api/work-orders
      backendRefs:
        - name: forge-service
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: modular
          port: 80
