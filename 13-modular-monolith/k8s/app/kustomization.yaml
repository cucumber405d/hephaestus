# The namespaced part of 13 (hephaestus-13): databases, services, route. Kept apart from the KafkaTopics, which live
# in namespace kafka: `kubectl -n hephaestus-13 apply -k` refuses an object of another namespace.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - databases.yaml
  - services.yaml
  - route.yaml

# Published by CI on main: sha-<7> of the merge commit of 13 (PR #16 -> b031665)
images:
  - name: modular
    newName: ghcr.io/cucumber405d/hephaestus/modular-monolith-modular
    newTag: sha-b031665
  - name: forge-service
    newName: ghcr.io/cucumber405d/hephaestus/modular-monolith-forge-service
    newTag: sha-b031665
  - name: supplier-stub
    newName: ghcr.io/cucumber405d/hephaestus/modular-monolith-supplier-stub
    newTag: sha-b031665
