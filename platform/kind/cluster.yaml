# Shared platform cluster (subprojects 05+): one control plane, two workers.
# The Gateway's NodePort 30080 is published on localhost:80, so http://<name>.localtest.me reaches it.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: hephaestus
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 80
        protocol: TCP
  - role: worker
  - role: worker
