# The platform's single entry point: Gateway API resources served by Envoy Gateway.
# Envoy's Service is a NodePort pinned to 30080, which kind publishes on localhost:80 of the control-plane node.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: platform-proxy
  namespace: envoy-gateway-system
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        pod:
          affinity:
            nodeAffinity:
              # Preferred, not required: a cluster created before the labels still schedules it
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: hephaestus.io/role
                        operator: In
                        values: ["stateful"]
      envoyService:
        type: NodePort
        # The default (Local) only accepts NodePort traffic on nodes running an Envoy pod; the Envoy pod runs on a
        # worker, while kind maps host port 80 to the control-plane node. Cluster lets any node forward to it.
        externalTrafficPolicy: Cluster
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - port: 80
                  nodePort: 30080
---
# Infrastructure provider's role: which controller implements Gateways of this class, and how
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: platform
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: platform-proxy
    namespace: envoy-gateway-system
---
# Cluster operator's role: one listener for *.localtest.me (resolves to 127.0.0.1); app teams attach HTTPRoutes
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: envoy-gateway-system
spec:
  gatewayClassName: platform
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      hostname: "*.localtest.me"
      allowedRoutes:
        namespaces:
          from: All
---
# Argo CD UI and API: http://argocd.localtest.me
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames:
    - argocd.localtest.me
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
