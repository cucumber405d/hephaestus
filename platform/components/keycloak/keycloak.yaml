# Keycloak by the Keycloak Operator, on its own CloudNativePG cluster; HTTP behind the Gateway.
# Admin credentials: secret keycloak-initial-admin (generated by the operator).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: keycloak-db
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: keycloak
      owner: keycloak
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 256Mi
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instances: 1
  db:
    vendor: postgres
    host: keycloak-db-rw
    database: keycloak
    usernameSecret:
      name: keycloak-db-app
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password
  http:
    httpEnabled: true
  hostname:
    hostname: http://keycloak.localtest.me
  proxy:
    headers: xforwarded
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 1536Mi
---
# http://keycloak.localtest.me (the operator's Service keycloak-service serves HTTP on 8080)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames:
    - keycloak.localtest.me
  rules:
    - backendRefs:
        - name: keycloak-service
          port: 8080
