# grafana/otel-lgtm: OpenTelemetry Collector, Prometheus, Loki, Tempo, Pyroscope and Grafana in one pod.
# A development backend: OTLP on lgtm.observability:4317 (gRPC) / 4318 (HTTP), Grafana on grafana.localtest.me.
# Data lives in an emptyDir and is gone with the pod; the production-shaped stack is subproject 11.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  labels:
    app.kubernetes.io/name: lgtm
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: lgtm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lgtm
    spec:
      containers:
        - name: lgtm
          image: grafana/otel-lgtm:0.30.0
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          readinessProbe:
            httpGet:
              path: /api/health
              port: grafana
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lgtm
  labels:
    app.kubernetes.io/name: lgtm
spec:
  selector:
    app.kubernetes.io/name: lgtm
  ports:
    - name: grafana
      port: 3000
      targetPort: grafana
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: platform
      namespace: envoy-gateway-system
  hostnames:
    - grafana.localtest.me
  rules:
    - backendRefs:
        - name: lgtm
          port: 3000
