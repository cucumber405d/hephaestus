{{- if .Values.components.cnpg }}
# CloudNativePG operator; each consumer declares its own postgresql.cnpg.io/Cluster
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: {{ .Values.versions.cloudnativePg | quote }}
    helm:
      releaseName: cnpg
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  {{- include "platform.syncPolicy" . | nindent 2 }}
{{- end }}
