# Where Argo CD reads the platform from; bootstrap.sh passes the revision (a PR branch in CI)
repoURL: https://github.com/cucumber405d/hephaestus.git
targetRevision: main

# Argo CD manages itself with this chart version; bootstrap.sh installs the same one
argocdChartVersion: 10.7.0

versions:
  envoyGateway: v1.8.3
  cloudnativePg: 0.29.0
  strimzi: 1.2.0
  keycloak: 26.8.1
  # 12: KEDA 2.21 supports Kubernetes 1.34-1.36 (kind node images of kind 0.30+); 2.20.x for 1.33-1.35
  keda: 2.21.0
  metricsServer: 3.13.0

# Profiles (values-minimal.yaml, values-full.yaml) switch these
components:
  argocd: true
  gateway: true
  cnpg: true
  observability: true
  catalog: true
  strimzi: false
  kafka: false
  keycloak: false
  redis: false
  # Subproject services (they need their images in GHCR first: enable after the first publish on main)
  serviceCommunication: false
  # 07: needs keycloak (full profile only); off until its images are published
  security: false
  # 12: autoscaling operators and the saga under load
  keda: false
  metricsServer: false
  scaling: false
  # 13: the modular monolith with Forge strangled out; off until CI has published its images (then also in
  # values-scaling.yaml / values-full.yaml); before that: 13-modular-monolith/scripts/deploy-local.sh
  modularMonolith: false
